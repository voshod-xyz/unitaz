        function createWaterRipple(x, z, maxRadius = 0.25, duration = 0.6) {
            if (ripples.length >= 100) return;
            const ringGeo = new THREE.RingGeometry(0.022, 0.025, 64);
            const ringMat = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.85,
                depthWrite: false
            });
            // Clip decorative rings to the actual elliptical water footprint.
            ringMat.onBeforeCompile = shader => {
                shader.uniforms.waterRadius = { value: rippleRadiusUniform };
                shader.vertexShader = 'varying vec3 rippleWorld;\n' + shader.vertexShader;
                shader.vertexShader = shader.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\nrippleWorld = (modelMatrix * vec4(position, 1.0)).xyz;');
                shader.fragmentShader = 'varying vec3 rippleWorld;\nuniform vec2 waterRadius;\n' + shader.fragmentShader;
                shader.fragmentShader = shader.fragmentShader.replace('#include <clipping_planes_fragment>', '#include <clipping_planes_fragment>\nif (length(vec2(rippleWorld.x, (rippleWorld.z + 0.25)) / waterRadius) > 1.0) discard;');
            };
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = -Math.PI / 2;
            ring.position.set(x, getWaterSurfaceY() + 0.002, z);
            scene.add(ring);

            ripples.push({
                mesh: ring,
                maxRadius: maxRadius,
                life: 0,
                maxLife: duration
            });
        }

        function createWaterSplash(pos, count = 6, speed = 0.35) {
            if (splashParticles.length >= 350) return;
            const splashGeo = fxDropGeometry;
            const splashMat = new THREE.MeshPhysicalMaterial({
                color: waterMaterial ? waterMaterial.color : 0x7dd3fc,
                transparent: true,
                opacity: 0.82,
                depthWrite: false,
                roughness: 0.06,
                clearcoat: 1.0,
                clearcoatRoughness: 0.03
            });

            count = Math.min(count * 2, 350 - splashParticles.length);
            const batch = { material: splashMat, remaining: count };
            for (let i = 0; i < count; i++) {
                const drop = new THREE.Mesh(splashGeo, splashMat);
                drop.scale.setScalar(0.4 + Math.random() * 0.65);
                drop.position.set(pos.x, pos.y, pos.z);
                const angle = Math.random() * Math.PI * 2;
                const upVel = 0.25 + Math.random() * speed;
                const radialVel = 0.05 + Math.random() * speed * 0.6;

                drop.userData = {
                    vx: Math.cos(angle) * radialVel,
                    vy: upVel,
                    vz: Math.sin(angle) * radialVel,
                    life: 0,
                    batch: batch,
                    size: drop.scale.x
                };
                scene.add(drop);
                splashParticles.push(drop);
            }
        }

        function updateWaterEffects(dt) {
            if (waterMesh && waterMesh.geometry) {
                const geo = waterMesh.geometry;
                const pos = geo.attributes.position;
                const userData = geo.userData;

                if (userData && userData.waveDisp) {
                    const springK = 35.0; 
                    const damping = Math.pow(0.92, dt * 60); 

                    for (let i = 0; i < pos.count; i++) {
                        if (userData.origY[i] > 0.005) {
                            const force = -springK * userData.waveDisp[i];
                            userData.waveVel[i] += force * dt;
                            userData.waveVel[i] *= damping;
                            userData.waveDisp[i] += userData.waveVel[i] * dt;

                            pos.setY(i, userData.origY[i] + userData.waveDisp[i]);
                        }
                    }
                    pos.needsUpdate = true;
                    geo.computeVertexNormals();
                }
            }

            for (let i = ripples.length - 1; i >= 0; i--) {
                const r = ripples[i];
                r.life += dt;
                const progress = r.life / r.maxLife;
                if (progress >= 1.0) {
                    scene.remove(r.mesh);
                    if (r.mesh.geometry) r.mesh.geometry.dispose();
                    if (r.mesh.material) r.mesh.material.dispose();
                    ripples.splice(i, 1);
                } else {
                    const scale = 1 + progress * (r.maxRadius / 0.025);
                    r.mesh.scale.set(scale, scale, 1);
                    r.mesh.material.opacity = 0.85 * (1 - progress);
                    r.mesh.position.y = getWaterSurfaceY() + 0.002;
                }
            }

            for (let i = splashParticles.length - 1; i >= 0; i--) {
                const drop = splashParticles[i];
                drop.userData.life += dt;
                drop.position.x += drop.userData.vx * dt;
                drop.position.y += drop.userData.vy * dt;
                drop.position.z += drop.userData.vz * dt;
                drop.userData.vy -= 9.8 * dt * 0.45;

                orientFluidDrop(drop, drop.userData.size);
                const landedInWater = insideWater(drop.position.x, drop.position.z) && drop.position.y <= getWaterSurfaceY();
                if (landedInWater || drop.position.y <= 0.008 || drop.userData.life > 1.8) {
                    if (landedInWater && drop.userData.life > 0.07 && Math.random() < 0.18)
                        createWaterRipple(drop.position.x, drop.position.z, 0.06, 0.3);
                    if (drop.position.y <= 0.008) createFloorSplatter(drop.position, drop.material.color.getHex(), 0.012);
                    scene.remove(drop);
                    if (--drop.userData.batch.remaining === 0) drop.userData.batch.material.dispose();
                    splashParticles.splice(i, 1);
                }
            }
        }

        const peeGeo = new THREE.SphereGeometry(0.011, 20, 12);
        const peeMat = new THREE.MeshPhysicalMaterial({
            color: 0xfacc15,
            transparent: true,
            opacity: 0.92,
            roughness: 0.05,
            clearcoat: 1.0,
            clearcoatRoughness: 0.05,
            transmission: 0.3,
            ior: 1.333,
            depthWrite: false
        });
        const puddleGeo = new THREE.CylinderGeometry(0.015, 0.015, 0.002, 12);

        let peeEmissionCarry = 0;
        function emitPeeParticles(dt = 1 / 60) {
            if (!state.isPeeing) { peeEmissionCarry = 0; return; }
            peeEmissionCarry += 240 * dt;
            const count = Math.floor(peeEmissionCarry);
            peeEmissionCarry -= count;
            for (let i = 0; i < count; i++) {
                const particle = new THREE.Mesh(peeGeo, peeMat);
                particle.position.set((Math.random() - 0.5) * 0.02, 1.45, 0.20 + (Math.random() - 0.5) * 0.02);
                particle.userData = {
                    vx: (Math.random() - 0.5) * 0.08,
                    vy: -1.0 - Math.random() * 0.4,
                    vz: -0.6 - Math.random() * 0.2,
                    life: 0,
                    bounced: false
                };
                // Distribute births through the timestep rather than four coincident balls.
                const age = count ? dt * i / count : 0;
                particle.position.x += particle.userData.vx * age;
                particle.position.y += particle.userData.vy * age - 1.225 * age * age;
                particle.position.z += particle.userData.vz * age;
                particle.userData.vy -= 2.45 * age;
                scene.add(particle);
                state.peeParticles.push(particle);
            }
        }

        function updatePeeParticles(dt) {
            const isLidClosed = (state.coverMode === 2 || Math.abs(state.currentLidAngle) < 0.25);
            const lidSurfaceY = 0.845;
            const surfaceY = getWaterSurfaceY();

            for (let i = state.peeParticles.length - 1; i >= 0; i--) {
                const p = state.peeParticles[i];
                if (!p || !p.position || !p.userData) {
                    if (p && p.parent) p.parent.remove(p);
                    state.peeParticles.splice(i, 1);
                    continue;
                }
                p.userData.life += dt;

                p.position.x += p.userData.vx * dt;
                p.position.y += p.userData.vy * dt;
                p.position.z += p.userData.vz * dt;
                p.userData.vy -= 9.8 * dt * 0.25;
                orientFluidDrop(p, p.userData.bounced ? 0.55 : 0.85);

                if (isLidClosed && p.position.y <= lidSurfaceY && !p.userData.bounced) {
                    if (p.position.x > -0.36 && p.position.x < 0.36 && p.position.z > -0.65 && p.position.z < 0.22) {
                        if (Math.random() > 0.4) {
                            const puddle = new THREE.Mesh(puddleGeo, peeMat);
                            const localPos = lidGroup.worldToLocal(p.position.clone());
                            puddle.position.copy(localPos);
                            puddle.position.y = 0.052;
                            lidGroup.add(puddle);
                            state.splatters.push({ mesh: puddle, type: 'pee', life: 0 });
                        }

                        for (let b = 0; b < 2; b++) {
                            const bounceP = new THREE.Mesh(peeGeo, peeMat);
                            bounceP.scale.setScalar(0.6);
                            bounceP.position.copy(p.position);
                            bounceP.userData = {
                                vx: (Math.random() - 0.5) * 0.5,
                                vy: 0.3 + Math.random() * 0.3,
                                vz: (Math.random() - 0.5) * 0.5,
                                life: 0,
                                bounced: true
                            };
                            scene.add(bounceP);
                            state.peeParticles.push(bounceP);
                        }

                        if (p.parent) p.parent.remove(p);
                        state.peeParticles.splice(i, 1);
                        continue;
                    }
                }

                if (!isLidClosed && p.position.y <= surfaceY && insideWater(p.position.x, p.position.z)) {
                    state.peeVol += 0.0035;
                    state.waterLevel = Math.min(state.maxWaterLevel, state.waterLevel + 0.0003);
                    
                    if (Math.random() < 0.25) {
                        triggerWaterWave(p.position.x, p.position.z, 0.012);
                        createWaterRipple(p.position.x, p.position.z, 0.12, 0.35);
                        createWaterSplash(new THREE.Vector3(p.position.x, surfaceY, p.position.z), 1, 0.15);
                    }

                    if (p.parent) p.parent.remove(p);
                    state.peeParticles.splice(i, 1);
                } else if (p.position.y < 0 || p.userData.life > 2.5) {
                    if (p.position.y < 0) {
                        state.floorPuddleVol += 0.0002;
                        if (Math.random() < 0.2) createFloorSplatter(p.position, 0xeab308, 0.018);
                    }
                    if (p.parent) p.parent.remove(p);
                    state.peeParticles.splice(i, 1);
                }
            }
        }

        function updatePoopPhysics(dt) {
            const isLidClosed = (state.coverMode === 2 || Math.abs(state.currentLidAngle) < 0.25);
            const lidSurfaceY = 0.845;
            const surfaceY = getWaterSurfaceY();

            for (let i = state.poopObjects.length - 1; i >= 0; i--) {
                const poop = state.poopObjects[i];
                if (!poop) continue;

                if (!poop.userData.isFloating && !poop.userData.isOnFloor && !state.isFlushing) {
                    poop.position.x += poop.userData.vx * dt;
                    poop.position.y += poop.userData.vy * dt;
                    poop.position.z += poop.userData.vz * dt;
                    poop.userData.vy -= 9.8 * dt * 0.5; 
                    poop.rotation.x += poop.userData.rotVx * dt;
                    poop.rotation.z += poop.userData.rotVz * dt;

                    // CLOSED LID COLLISION (SMEARING ON LID)
                    if (isLidClosed && poop.position.y <= lidSurfaceY) {
                        if (poop.position.x > -0.36 && poop.position.x < 0.36 && poop.position.z > -0.65 && poop.position.z < 0.22) {
                            playSplatSound();
                            
                            createStoolFragments(poop.position.clone(), poop.userData.color, 8);
                            const localPos = lidGroup.worldToLocal(poop.position.clone());
                            poop.position.copy(localPos);
                            poop.position.y = 0.052;

                            poop.rotation.set(0, 0, 0);
                            poop.scale.set(1.4, 0.2, 1.4);
                            
                            scene.remove(poop);
                            lidGroup.add(poop);
                            
                            state.splatters.push({ mesh: poop, type: 'poop', life: 0 });
                            state.poopObjects.splice(i, 1);
                            continue;
                        }
                    }

                    // WATER SURFACE SPLASH & LIQUID WAVES
                    if (!isLidClosed && poop.position.y <= surfaceY && insideWater(poop.position.x, poop.position.z)) {
                        poop.position.y = surfaceY;
                        poop.userData.isFloating = true;
                        playPlopSound();
                        
                        state.poopVol += 0.22;
                        state.waterLevel = Math.min(state.maxWaterLevel, state.waterLevel + 0.018);

                        triggerWaterWave(poop.position.x, poop.position.z, 0.05);
                        createWaterRipple(poop.position.x, poop.position.z, 0.38, 0.85);
                        const impact = new THREE.Vector3(poop.position.x, surfaceY, poop.position.z);
                        createWaterSplash(impact, 18, Math.min(1.3, Math.abs(poop.userData.vy) * 0.3));
                        createImpactCrown(impact);
                        createStoolFragments(impact, poop.userData.color, poop.userData.formType === 2 ? 12 : 5);
                    } 
                    // FALLING OFF TO FLOOR
                    else if (poop.position.y <= 0.015) {
                        poop.userData.isOnFloor = true;
                        poop.position.y = 0.015;
                        poop.userData.vx = 0;
                        poop.userData.vy = 0;
                        poop.userData.vz = 0;
                        poop.scale.set(1.4, 0.2, 1.4);
                        playSplatSound();
                        createFloorSplatter(poop.position, poop.userData.color || 0x211005, 0.12 + Math.random() * 0.1);
                    }
                } else if (poop.userData.isFloating && !state.isFlushing) {
                    if (isLidClosed && poop.position.y >= lidSurfaceY - 0.05) {
                        playSplatSound();
                        const localPos = lidGroup.worldToLocal(poop.position.clone());
                        poop.position.copy(localPos);
                        poop.position.y = 0.052;
                        poop.rotation.set(0, 0, 0);
                        poop.userData.isFloating = false;
                        poop.scale.set(1.5, 0.2, 1.5);
                        scene.remove(poop);
                        lidGroup.add(poop);
                        state.splatters.push({ mesh: poop, type: 'poop', life: 0 });
                        state.poopObjects.splice(i, 1);
                        continue;
                    }

                    poop.position.y = surfaceY + Math.sin(Date.now() * 0.004 + (i * 0.5)) * 0.004;

                    // OVERFLOW SPILL OVER RIM ONTO FLOOR
                    if (state.waterLevel >= RIM_HEIGHT && Math.random() < 0.03) {
                        poop.userData.isFloating = false;
                        poop.userData.isOnFloor = true;
                        
                        const angle = Math.random() * Math.PI * 2;
                        const dist = 0.45 + Math.random() * 0.4;
                        poop.position.set(
                            Math.cos(angle) * dist,
                            0.015,
                            BOWL_CENTER_Z + Math.sin(angle) * dist
                        );
                        poop.scale.set(1.4, 0.2, 1.4);
                        playSplatSound();

                        createFloorSplatter(poop.position, poop.userData.color || 0x4a2810, 0.12 + Math.random() * 0.1);
                    }
                }
            }
        }

        function createFloorSplatter(pos, colorHex, radius) {
            if (state.floorSplatters.length >= 240) {
                const old = state.floorSplatters.shift();
                old.parent.remove(old); old.geometry.dispose(); old.material.dispose();
            }
            const splatGeo = new THREE.CircleGeometry(radius, 48);
            const edge = splatGeo.attributes.position;
            for (let i = 1; i < edge.count; i++) {
                const a = Math.atan2(edge.getY(i), edge.getX(i));
                const wobble = 1 + 0.12 * Math.sin(a * 5) + 0.07 * Math.cos(a * 9);
                edge.setXY(i, edge.getX(i) * wobble, edge.getY(i) * wobble);
            }
            const splatMat = new THREE.MeshBasicMaterial({
                color: colorHex,
                transparent: true,
                opacity: 0.88,
                depthWrite: false
            });
            const splat = new THREE.Mesh(splatGeo, splatMat);
            splat.rotation.x = -Math.PI / 2;
            splat.position.set(pos.x, 0.006, pos.z);
            splat.scale.set(1 + Math.random() * 0.4, 1 + Math.random() * 0.4, 1);
            floorSplatGroup.add(splat);
            state.floorSplatters.push(splat);
        }

        function updateSplatters(dt) {
            const tilt = Math.sin(-state.currentLidAngle);

            for (let i = state.splatters.length - 1; i >= 0; i--) {
                const s = state.splatters[i];
                if (!s || !s.mesh) continue;
                s.life += dt;

                if (tilt > 0.08) {
                    const slideSpeed = (s.type === 'pee' ? 0.38 : 0.20) * tilt;
                    s.mesh.position.z -= slideSpeed * dt;

                    if (s.type === 'pee') {
                        s.mesh.scale.z = Math.min(5.0, s.mesh.scale.z + dt * 2.5);
                    } else if (s.type === 'poop') {
                        s.mesh.scale.z = Math.min(2.5, s.mesh.scale.z + dt * 1.2);
                    }

                    if (s.mesh.position.z <= 0.02) {
                        const worldPos = lidGroup.localToWorld(s.mesh.position.clone());
                        lidGroup.remove(s.mesh);

                        if (s.type === 'poop') {
                            scene.add(s.mesh);
                            s.mesh.position.copy(worldPos);
                            s.mesh.rotation.set(0, 0, 0);
                            s.mesh.userData = {
                                vx: (Math.random() - 0.5) * 0.04,
                                vy: -0.4,
                                vz: (Math.random() - 0.5) * 0.04,
                                rotVx: (Math.random() - 0.5) * 2,
                                rotVz: (Math.random() - 0.5) * 2,
                                isFloating: false,
                                isOnFloor: false,
                                color: s.mesh.userData.color || 0x4a2810
                            };
                            state.poopObjects.push(s.mesh);
                            playSplatSound();
                        } else if (s.type === 'pee') {
                            // Actual falling drops replace instant teleportation into the bowl.
                            for (let d = 0; d < 5; d++) {
                                const drop = new THREE.Mesh(peeGeo, peeMat);
                                drop.position.copy(worldPos);
                                drop.position.x += (Math.random() - 0.5) * 0.012;
                                drop.userData = { vx: 0, vy: -0.2 - d * 0.07, vz: 0.12, life: 0, bounced: true };
                                scene.add(drop); state.peeParticles.push(drop);
                            }
                        }

                        state.splatters.splice(i, 1);
                        continue;
                    }
                } else {
                    if (s.type === 'pee') {
                        s.mesh.scale.x = Math.min(s.mesh.scale.x + dt * 0.8, 3.5);
                        s.mesh.scale.z = Math.min(s.mesh.scale.z + dt * 0.8, 3.5);
                        s.mesh.position.z = Math.min(s.mesh.position.z + dt * 0.04, 0.70); 
                    } else if (s.type === 'poop') {
                        s.mesh.position.z = Math.min(s.mesh.position.z + dt * 0.015, 0.65);
                    }
                }
            }
        }

        function updateOverflowMechanics(dt) {
            if (state.waterLevel >= RIM_HEIGHT) {
                const overflowAmount = (state.waterLevel - RIM_HEIGHT);
                const overflowRate = (overflowAmount + 0.05) * dt * 2.0;
                state.floorPuddleVol += overflowRate;
                state.waterLevel = Math.max(RIM_HEIGHT - 0.001, state.waterLevel - overflowRate * 0.15);

                if (Math.random() < 1 - Math.exp(-18 * dt)) {
                    const angle = Math.random() * Math.PI * 2;
                    const radius = 0.42;
                    const pos = new THREE.Vector3(
                        Math.cos(angle) * (radius + Math.random() * 0.15),
                        0.01,
                        BOWL_CENTER_Z + Math.sin(angle) * (radius + Math.random() * 0.15)
                    );
                    
                    const totalVol = Math.max(0.001, state.waterVol + state.peeVol + state.poopVol);
                    const pRatio = state.peeVol / totalVol;
                    const fRatio = state.poopVol / totalVol;
                    
                    let splatColor = 0x38bdf8;
                    if (fRatio > 0.12) splatColor = 0x5c3317;
                    else if (pRatio > 0.08) splatColor = 0xeab308;

                    createFloorSplatter(pos, splatColor, 0.06 + Math.random() * 0.09);
                }
            }

            if (state.floorPuddleVol > 0) {
                const puddleRadius = Math.min(3.2, Math.sqrt(state.floorPuddleVol) * 1.4);
                floorPuddleMesh.scale.set(puddleRadius, puddleRadius, 1.0);
                floorPuddleMaterial.opacity = Math.min(0.92, 0.25 + state.floorPuddleVol * 1.4);
            }
        }

        function triggerFlush() {
            if (state.isFlushing) return;
            initAudio();
            state.isFlushing = true;
            state.flushPhase = 1; 
            state.flushTimer = 0;
            playFlushSound();
        }

        function updateFlushSequence(dt) {
            if (!state.isFlushing) return;
            state.flushTimer += dt;

            if (state.flushPhase === 1) {
                waterMesh.rotation.y += dt * 8.0;
                state.waterLevel = Math.max(0.32, state.waterLevel - dt * 0.18);
                
                state.poopObjects.forEach((poop) => {
                    if (poop && poop.userData && poop.userData.isFloating) {
                        const dx = 0 - poop.position.x;
                        const dz = BOWL_CENTER_Z - poop.position.z;
                        const dist = Math.sqrt(dx * dx + dz * dz);
                        const angle = Math.atan2(-dz, -dx) + dt * 6.0;
                        const newDist = Math.max(0.01, dist - dt * 0.18);

                        poop.position.x = Math.cos(angle) * newDist;
                        poop.position.z = BOWL_CENTER_Z + Math.sin(angle) * newDist;
                        poop.position.y = state.waterLevel;
                        poop.scale.multiplyScalar(Math.pow(0.94, dt * 60)); 
                    }
                });

                for (let i = state.poopObjects.length - 1; i >= 0; i--) {
                    const poop = state.poopObjects[i];
                    if (poop && poop.userData && poop.userData.isFloating && poop.scale.x < 0.1) {
                        scene.remove(poop);
                        const materials = new Set();
                        poop.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) materials.add(o.material); });
                        materials.forEach(m => m.dispose());
                        state.poopObjects.splice(i, 1);
                    }
                }

                if (state.flushTimer > 2.2) state.flushPhase = 2;
            } else if (state.flushPhase === 2) {
                waterMesh.rotation.y += dt * 2.0;
                state.waterLevel = Math.min(state.baseWaterLevel, state.waterLevel + dt * 0.12);
                
                state.peeVol = Math.max(0.0, state.peeVol - dt * 0.6);
                state.poopVol = Math.max(0.0, state.poopVol - dt * 0.6);

                if (state.flushTimer > 4.0 && Math.abs(state.waterLevel - state.baseWaterLevel) < 0.01) {
                    state.isFlushing = false;
                    state.waterLevel = state.baseWaterLevel;
                    state.peeVol = 0.0;
                    state.poopVol = 0.0;
                    waterMesh.rotation.y = 0;
                }
            }
        }

        function updateVisuals() {
            const visualWaterY = Math.min(RIM_HEIGHT + 0.012, state.waterLevel);
            waterMesh.position.y = visualWaterY;

            const heightFactor = Math.max(0, Math.min(1.0, (visualWaterY - 0.28) / (RIM_HEIGHT - 0.28)));
            const radiusScale = 0.5 + heightFactor * 0.52;
            waterMesh.scale.set(radiusScale, 1.0, radiusScale * 1.15);
            rippleRadiusUniform.set(0.33 * radiusScale, 0.33 * radiusScale * 1.15);

            const totalVol = Math.max(0.001, state.waterVol + state.peeVol + state.poopVol);
            const pRatio = state.peeVol / totalVol;
            const fRatio = state.poopVol / totalVol;

            const peeColorFactor = Math.min(1.0, Math.pow(pRatio * 4.0, 0.65));
            const fecesColorFactor = Math.min(1.0, Math.pow(fRatio * 2.5, 0.8));

            const cleanColor = new THREE.Color(0x38bdf8); 
            const urineColor = new THREE.Color(0xeab308); 
            const fecesColor = new THREE.Color(0x4a2810); 

            let blendedColor = cleanColor.clone().lerp(urineColor, peeColorFactor);
            if (fecesColorFactor > 0) {
                blendedColor.lerp(fecesColor, fecesColorFactor);
            }

            waterMaterial.color.copy(blendedColor);
            floorPuddleMaterial.color.copy(blendedColor);
            waterMaterial.opacity = 0.78 + fecesColorFactor * 0.2; 

            const fillPercent = Math.round((state.waterLevel / RIM_HEIGHT) * 100);
            barWater.style.width = `${Math.min(100, fillPercent)}%`;
            
            if (fillPercent > 100) {
                statWater.innerText = `${fillPercent}% (Перелив!)`;
            } else {
                statWater.innerText = `${fillPercent}%`;
            }

            const lidText = document.getElementById('lid-text');
            const lidIcon = document.getElementById('lid-icon');
            if (lidText && lidIcon) {
                if (state.coverMode === 0) {
                    lidText.innerText = 'Крышка: Открыто всё';
                    lidIcon.innerText = '🚽';
                    btnLid.className = 'btn-action bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-600 font-bold py-3 px-2 rounded-2xl flex flex-col items-center gap-1 flex-1 select-none';
                } else if (state.coverMode === 1) {
                    lidText.innerText = 'Крышка: Сиденье';
                    lidIcon.innerText = '⭕';
                    btnLid.className = 'btn-action bg-sky-900/60 hover:bg-sky-800/80 text-sky-200 border border-sky-500 font-bold py-3 px-2 rounded-2xl flex flex-col items-center gap-1 flex-1 select-none';
                } else {
                    lidText.innerText = 'Крышка: Всё закрыто';
                    lidIcon.innerText = '🔒';
                    btnLid.className = 'btn-action bg-amber-900/60 hover:bg-amber-800/80 text-amber-200 border border-amber-500 font-bold py-3 px-2 rounded-2xl flex flex-col items-center gap-1 flex-1 select-none';
                }
            }

            if (fillPercent >= 100) {
                barWater.className = 'bg-rose-500 h-full transition-all duration-200 animate-pulse';
                statOverflow.innerText = `⚠️ ПЕРЕЛИВ (${fillPercent - 100}% выше нормы)`;
                statOverflow.className = 'font-bold text-rose-500 animate-pulse';
            } else if (state.floorPuddleVol > 0) {
                barWater.className = 'bg-amber-500 h-full transition-all duration-200';
                statOverflow.innerText = 'Лужа на полу';
                statOverflow.className = 'font-bold text-amber-400';
            } else {
                barWater.className = 'bg-cyan-500 h-full transition-all duration-200';
                statOverflow.innerText = 'Сухо';
                statOverflow.className = 'font-bold text-emerald-400';
            }

            if (fecesColorFactor > 0.3) {
                statMix.innerText = 'Густая масса';
                statMix.className = 'font-bold text-amber-700';
            } else if (fecesColorFactor > 0.05 || peeColorFactor > 0.4) {
                statMix.innerText = 'Ярко-желтая вода';
                statMix.className = 'font-bold text-yellow-400';
            } else if (peeColorFactor > 0.05) {
                statMix.innerText = 'Подкрашенная вода';
                statMix.className = 'font-bold text-yellow-300';
            } else {
                statMix.innerText = 'Чистая вода';
                statMix.className = 'font-bold text-sky-400';
            }
        }

        function setupUIListeners() {
            const startPee = (e) => {
                if (e) e.preventDefault();
                if (state.isPeeing) return;
                initAudio();
                state.isPeeing = true;
                btnPee.classList.add('glow-active');
                startPeeSound();
            };
            const stopPee = (e) => {
                if (e) e.preventDefault();
                if (!state.isPeeing) return;
                state.isPeeing = false;
                btnPee.classList.remove('glow-active');
                stopPeeSound();
            };

            btnPee.addEventListener('pointerdown', startPee);
            btnPee.addEventListener('pointerup', stopPee);
            btnPee.addEventListener('pointerleave', stopPee);
            btnPee.addEventListener('pointercancel', stopPee);
            window.addEventListener('blur', () => stopPee());
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) stopPee();
                lastTime = performance.now();
            });

            btnPoop.addEventListener('click', (e) => {
                e.preventDefault();
                spawnPoop();
            });

            btnFlush.addEventListener('click', (e) => {
                e.preventDefault();
                triggerFlush();
            });

            const toggleLid = () => {
                initAudio();
                state.coverMode = (state.coverMode + 1) % 3;
                if (state.coverMode === 0) {
                    state.targetSeatAngle = -1.85;
                    state.targetLidAngle = -1.85;
                } else if (state.coverMode === 1) {
                    state.targetSeatAngle = 0.0;
                    state.targetLidAngle = -1.85;
                } else if (state.coverMode === 2) {
                    state.targetSeatAngle = 0.0;
                    state.targetLidAngle = 0.0;
                }
            };

            btnLid.addEventListener('click', (e) => {
                e.preventDefault();
                toggleLid();
            });

            // Keyboard Shortcuts
            window.addEventListener('keydown', (e) => {
                if (e.repeat) return;
                const key = e.key.toLowerCase();
                if (key === '1' || key === 'q' || key === 'й') {
                    startPee();
                } else if (key === '2' || key === 'w' || key === 'ц') {
                    spawnPoop();
                    btnPoop.classList.add('scale-95');
                    setTimeout(() => btnPoop.classList.remove('scale-95'), 120);
                } else if (key === 'enter') {
                    e.preventDefault();
                    triggerFlush();
                    btnFlush.classList.add('scale-95');
                    setTimeout(() => btnFlush.classList.remove('scale-95'), 120);
                } else if (key === ' ' || key === 'spacebar') {
                    e.preventDefault();
                    toggleLid();
                    btnLid.classList.add('scale-95');
                    setTimeout(() => btnLid.classList.remove('scale-95'), 120);
                }
            });

            window.addEventListener('keyup', (e) => {
                const key = e.key.toLowerCase();
                if (key === '1' || key === 'q' || key === 'й') {
                    stopPee();
                }
            });

            btnSound.addEventListener('click', () => {
                state.soundEnabled = !state.soundEnabled;
                soundIcon.innerText = state.soundEnabled ? '🔊' : '🔇';
                soundLabel.innerText = state.soundEnabled ? 'Звук Вкл' : 'Звук Выкл';
                if (!state.soundEnabled) stopPeeSound();
            });

            const setCameraView = (pos, target) => {
                controls.target.copy(target);
                camera.position.copy(pos);
            };

            document.getElementById('cam-preset-1').addEventListener('click', () => setCameraView(new THREE.Vector3(0, 2.3, 2.9), new THREE.Vector3(0, 0.7, BOWL_CENTER_Z)));
            document.getElementById('cam-preset-2').addEventListener('click', () => setCameraView(new THREE.Vector3(0, 3.2, 0.01), new THREE.Vector3(0, 0.5, BOWL_CENTER_Z)));
            document.getElementById('cam-preset-3').addEventListener('click', () => setCameraView(new THREE.Vector3(2.8, 1.2, BOWL_CENTER_Z), new THREE.Vector3(0, 0.7, BOWL_CENTER_Z)));
            document.getElementById('cam-preset-4').addEventListener('click', () => setCameraView(new THREE.Vector3(0, 1.25, 0.95), new THREE.Vector3(0, 0.62, BOWL_CENTER_Z)));
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setPixelRatio(getRenderPixelRatio());
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Shared resources stay alive for the lifetime of the scene.
        const fxDropGeometry = new THREE.SphereGeometry(0.012, 16, 10);
        const rippleRadiusUniform = new THREE.Vector2(0.24, 0.276);
        const fluidAxis = new THREE.Vector3(0, 1, 0);
        const fluidVelocity = new THREE.Vector3();
        const crowns = [], stoolFragments = [];
        let runoffClock = 0;

        function insideWater(x, z) {
            const h = Math.min(RIM_HEIGHT + 0.012, state.waterLevel);
            const r = 0.33 * (0.5 + Math.max(0, Math.min(1, (h - 0.28) / (RIM_HEIGHT - 0.28))) * 0.52);
            return (x / r) ** 2 + ((z - BOWL_CENTER_Z) / (r * 1.15)) ** 2 <= 1;
        }

        function orientFluidDrop(mesh, size) {
            const u = mesh.userData;
            fluidVelocity.set(u.vx, u.vy, u.vz);
            const speed = fluidVelocity.length();
            if (speed > 0.0001) mesh.quaternion.setFromUnitVectors(fluidAxis, fluidVelocity.multiplyScalar(1 / speed));
            const stretch = Math.min(3.2, 1 + speed * 0.55);
            mesh.scale.set(size / Math.sqrt(stretch), size * stretch, size / Math.sqrt(stretch));
        }

        function createImpactCrown(pos) {
            if (crowns.length >= 12) return;
            const geo = new THREE.CylinderGeometry(0.055, 0.024, 0.06, 64, 1, true);
            const attr = geo.attributes.position;
            for (let i = 0; i < attr.count; i++) {
                if (attr.getY(i) > 0) {
                    const a = Math.atan2(attr.getZ(i), attr.getX(i));
                    attr.setY(i, 0.025 + Math.pow(0.5 + 0.5 * Math.sin(a * 11), 3) * 0.055);
                }
            }
            geo.computeVertexNormals();
            const mat = new THREE.MeshPhysicalMaterial({color: waterMaterial.color, transparent: true,
                opacity: 0.65, roughness: 0.05, clearcoat: 1, side: THREE.DoubleSide, depthWrite: false});
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.copy(pos); scene.add(mesh);
            crowns.push({mesh, age: 0});
        }

        function createStoolFragments(pos, color, count) {
            for (let i = 0; i < count && stoolFragments.length < 140; i++) {
                const mat = new THREE.MeshPhysicalMaterial({color: color || 0x4a2810,
                    roughness: 0.3, clearcoat: 0.85, bumpMap: proceduralTextures.stoolBump,
                    bumpScale: 0.002, transparent: true, depthWrite: false});
                const mesh = new THREE.Mesh(fxDropGeometry, mat);
                mesh.position.copy(pos);
                const a = Math.random() * Math.PI * 2;
                mesh.userData = {vx: Math.cos(a) * (0.15 + Math.random() * 0.3),
                    vy: 0.25 + Math.random() * 0.55, vz: Math.sin(a) * (0.15 + Math.random() * 0.3),
                    age: 0, size: 0.35 + Math.random() * 0.65};
                mesh.scale.set(mesh.userData.size, mesh.userData.size * 0.7, mesh.userData.size * 1.3);
                scene.add(mesh); stoolFragments.push(mesh);
            }
        }

        function createRunoff(angle) {
            if (state.spillCascades.length >= 24) return;
            // Follow the original lathe's exterior, not a straight line through porcelain.
            const profile = [[0.427,0.785],[0.428,0.745],[0.367,0.59],
                [0.29,0.35],[0.31,0.20],[0.35,0.018]];
            const path = new THREE.CatmullRomCurve3(profile.map(([r,y]) =>
                new THREE.Vector3(Math.cos(angle)*r,y,BOWL_CENTER_Z+Math.sin(angle)*r*1.18)));
            const geo = new THREE.TubeGeometry(path, 36, 0.006 + Math.random()*0.004, 7, false);
            const mat = new THREE.MeshPhysicalMaterial({color: waterMaterial.color, transparent:true,
                opacity:0.55, roughness:0.06, clearcoat:1, depthWrite:false});
            const mesh = new THREE.Mesh(geo, mat);
            geo.setDrawRange(0, 0); scene.add(mesh);
            state.spillCascades.push({mesh, age:0, duration:1.3+Math.random(), end:path.getPoint(1), landed:false});
        }

        function updateEnhancedEffects(dt) {
            for (let i = crowns.length - 1; i >= 0; i--) {
                const c = crowns[i]; c.age += dt;
                const t = c.age / 0.45;
                if (t >= 1) {
                    scene.remove(c.mesh); c.mesh.geometry.dispose(); c.mesh.material.dispose(); crowns.splice(i,1);
                } else {
                    c.mesh.position.y = getWaterSurfaceY() + 0.015;
                    c.mesh.scale.set(0.7+t*1.5, Math.max(0.02, Math.sin(Math.PI*t)), 0.7+t*1.5);
                    c.mesh.material.opacity = 0.7*(1-t);
                }
            }
            for (let i = stoolFragments.length - 1; i >= 0; i--) {
                const m = stoolFragments[i], u = m.userData; u.age += dt;
                if (!u.settled) {
                    m.position.x += u.vx*dt; m.position.y += u.vy*dt; m.position.z += u.vz*dt;
                    u.vy -= 4.9*dt; m.rotation.x += dt*3;
                    if (u.vy < 0 && insideWater(m.position.x,m.position.z) && m.position.y <= getWaterSurfaceY()) {
                        u.settled = 'water'; createWaterRipple(m.position.x,m.position.z,0.07,0.4);
                    } else if (m.position.y <= 0.009) {
                        u.settled = 'floor'; m.position.y=0.009;
                        createFloorSplatter(m.position,m.material.color.getHex(),0.018*u.size);
                    }
                } else if (u.settled === 'water') {
                    m.position.y = getWaterSurfaceY() - Math.min(0.05,u.age*0.012);
                    if (state.isFlushing) { m.position.x *= Math.exp(-dt); m.position.z += (BOWL_CENTER_Z-m.position.z)*dt; }
                }
                m.material.opacity = Math.max(0,1-u.age/3);
                if (u.age >= 3) {scene.remove(m); m.material.dispose(); stoolFragments.splice(i,1);}
            }
            if (state.waterLevel >= RIM_HEIGHT-0.002) {
                runoffClock += dt;
                while (runoffClock >= 0.12) {runoffClock -= 0.12; createRunoff(Math.random()*Math.PI*2);}
            } else runoffClock = 0;
            for (let i = state.spillCascades.length-1; i>=0; i--) {
                const c=state.spillCascades[i]; c.age+=dt;
                const total=c.mesh.geometry.index.count;
                c.mesh.geometry.setDrawRange(0,Math.floor(total*Math.min(1,c.age/0.6)/3)*3);
                c.mesh.material.opacity=0.6*Math.min(1, Math.max(0,(c.duration-c.age)/0.4));
                if (!c.landed && c.age>=0.6) {
                    c.landed=true; createFloorSplatter(c.end,c.mesh.material.color.getHex(),0.045);
                }
                if (c.age>=c.duration) {
                    scene.remove(c.mesh); c.mesh.geometry.dispose(); c.mesh.material.dispose(); state.spillCascades.splice(i,1);
                }
            }
        }

        let lastTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);

            const now = performance.now();
            const dt = Math.min(0.05, (now - lastTime) / 1000);
            lastTime = now;

            const hingeEase = 1 - Math.pow(0.88, dt * 60);
            state.currentSeatAngle += (state.targetSeatAngle - state.currentSeatAngle) * hingeEase;
            state.currentLidAngle += (state.targetLidAngle - state.currentLidAngle) * hingeEase;
            seatGroup.rotation.x = state.currentSeatAngle;
            lidGroup.rotation.x = state.currentLidAngle;

            scene.updateMatrixWorld(true);
            emitPeeParticles(dt);
            
            updatePeeParticles(dt);
            updatePoopPhysics(dt);
            updateSplatters(dt);
            updateOverflowMechanics(dt);
            updateFlushSequence(dt);
            updateWaterEffects(dt);
            updateVisuals();
            updateEnhancedEffects(dt);

            controls.update();
            renderer.render(scene, camera);
        }

        window.onload = () => {
            initScene();
            initEnvironment();
            createToiletGeometry();
            setupUIListeners();
            animate();
        };
    </script>
</body>
</html>
