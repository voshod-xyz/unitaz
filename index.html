<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Toilet Simulator - HD Realism Edition</title>
    <!-- Tailwind CSS for UI Layout -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls for camera manipulation -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
            background-color: #090d16;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .hud-glass {
            background: rgba(15, 23, 42, 0.82);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .btn-action {
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            touch-action: manipulation;
        }
        .btn-action:active {
            transform: scale(0.94);
        }
        .btn-yellow {
            background: linear-gradient(135deg, #eab308 0%, #ca8a04 100%);
            box-shadow: 0 4px 18px rgba(234, 179, 8, 0.35);
        }
        .btn-yellow:hover {
            background: linear-gradient(135deg, #facc15 0%, #d97706 100%);
        }
        .btn-brown {
            background: linear-gradient(135deg, #854d0e 0%, #582f0e 100%);
            box-shadow: 0 4px 18px rgba(133, 77, 14, 0.4);
        }
        .btn-brown:hover {
            background: linear-gradient(135deg, #a16207 0%, #713f12 100%);
        }
        .btn-blue {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            box-shadow: 0 4px 22px rgba(2, 132, 199, 0.45);
        }
        .btn-blue:hover {
            background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
        }
        .glow-active {
            box-shadow: 0 0 24px rgba(234, 179, 8, 0.85);
        }
    </style>
</head>
<body class="text-white">
    <!-- 3D Canvas Viewport -->
    <div id="canvas-container"></div>

    <!-- UI Overlay Layer -->
    <div class="relative z-10 flex flex-col justify-between h-full p-4 pointer-events-none">
        
        <!-- Header Bar -->
        <div class="flex justify-between items-start w-full max-w-5xl mx-auto pointer-events-auto">
            <div class="hud-glass p-3 px-5 rounded-2xl flex items-center gap-3 shadow-2xl">
                <span class="text-3xl">🚽</span>
                <div>
                    <h1 class="font-bold text-lg leading-tight tracking-wide text-slate-100">3D Туалет Симулятор HD</h1>
                    <p class="text-xs text-slate-400">Реалистичная физика кала человека, микротекстуры и PBR-материалы</p>
                </div>
            </div>

            <!-- Sound & Preset Controls -->
            <div class="hud-glass p-2 rounded-2xl flex items-center gap-2 shadow-xl">
                <button id="btn-sound" class="btn-action p-2 px-3 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-xs font-semibold text-slate-200 border border-slate-700 flex items-center gap-1.5">
                    <span id="sound-icon">🔊</span> <span id="sound-label">Звук Вкл</span>
                </button>
            </div>
        </div>

        <!-- Left Side Stats & Physics HUD -->
        <div class="pointer-events-auto self-start mt-4 ml-0 md:ml-4 flex flex-col gap-2 max-w-xs w-full">
            <div class="hud-glass p-4 rounded-2xl flex flex-col gap-3 shadow-2xl">
                <div class="flex justify-between text-xs text-slate-300 font-medium">
                    <span>Заполнение чаши:</span>
                    <span id="stat-water-level" class="font-bold text-cyan-400">60%</span>
                </div>
                <div class="w-full bg-slate-800/90 rounded-full h-2.5 overflow-hidden border border-slate-700/60">
                    <div id="bar-water-level" class="bg-cyan-500 h-full transition-all duration-200" style="width: 60%"></div>
                </div>

                <div class="flex justify-between text-xs text-slate-300 font-medium">
                    <span>Состав жидкости:</span>
                    <span id="stat-mix-status" class="font-bold text-sky-400">Чистая вода</span>
                </div>

                <div class="flex justify-between text-xs text-slate-300 font-medium border-t border-slate-700/50 pt-2">
                    <span>Форма кала (Scale):</span>
                    <span id="stat-bristol-type" class="font-bold text-amber-400">Тип 4 (Норма)</span>
                </div>

                <div class="flex justify-between text-xs text-slate-300 font-medium border-t border-slate-700/40 pt-1">
                    <span>Состояние пола:</span>
                    <span id="stat-overflow-status" class="font-bold text-emerald-400">Сухо</span>
                </div>
            </div>

            <!-- Camera View Presets -->
            <div class="hud-glass p-2 rounded-2xl flex justify-between gap-1 shadow-xl">
                <button id="cam-preset-1" class="btn-action text-xs px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 flex-1 font-medium border border-slate-700">3D Вид</button>
                <button id="cam-preset-2" class="btn-action text-xs px-2.5 py-1.5 rounded-lg bg-slate-800/60 hover:bg-slate-700 text-slate-300 flex-1 font-medium border border-slate-700/50">Сверху</button>
                <button id="cam-preset-3" class="btn-action text-xs px-2.5 py-1.5 rounded-lg bg-slate-800/60 hover:bg-slate-700 text-slate-300 flex-1 font-medium border border-slate-700/50">Сбоку</button>
                <button id="cam-preset-4" class="btn-action text-xs px-2.5 py-1.5 rounded-lg bg-slate-800/60 hover:bg-slate-700 text-slate-300 flex-1 font-medium border border-slate-700/50">Чаша</button>
            </div>
        </div>

        <!-- Bottom Action Controls -->
        <div class="pointer-events-auto w-full max-w-2xl mx-auto mb-2">
            <div class="hud-glass p-3 rounded-3xl flex items-center justify-around gap-2 shadow-2xl">
                
                <!-- Button Pee -->
                <button id="btn-pee" class="btn-action btn-yellow text-white font-bold py-3 px-3 md:px-4 rounded-2xl flex flex-col items-center gap-1 flex-1 select-none relative group">
                    <span class="absolute -top-2 bg-yellow-600/90 text-[10px] px-1.5 py-0.5 rounded-full font-mono border border-yellow-300/40">1 / Q</span>
                    <span class="text-2xl transition-transform group-hover:scale-110">🟡</span>
                    <span class="text-xs md:text-sm tracking-wider uppercase">Ссать</span>
                </button>

                <!-- Button Poop -->
                <button id="btn-poop" class="btn-action btn-brown text-white font-bold py-3 px-3 md:px-4 rounded-2xl flex flex-col items-center gap-1 flex-1 select-none relative group">
                    <span class="absolute -top-2 bg-amber-900/90 text-[10px] px-1.5 py-0.5 rounded-full font-mono border border-amber-400/40">2 / W</span>
                    <span class="text-2xl transition-transform group-hover:scale-110">💩</span>
                    <span class="text-xs md:text-sm tracking-wider uppercase">Срать</span>
                </button>

                <!-- Button Flush -->
                <button id="btn-flush" class="btn-action btn-blue text-white font-black py-3.5 px-4 md:px-5 rounded-2xl flex flex-col items-center gap-1 flex-1 select-none relative group">
                    <span class="absolute -top-2 bg-sky-700/90 text-[10px] px-1.5 py-0.5 rounded-full font-mono border border-sky-300/40">Enter</span>
                    <span class="text-2xl transition-transform group-hover:scale-110">🌀</span>
                    <span class="text-xs md:text-sm tracking-widest uppercase">СМЫВ</span>
                </button>

                <!-- Button Lid Control -->
                <button id="btn-lid" class="btn-action bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-600 font-bold py-3 px-2 rounded-2xl flex flex-col items-center gap-1 flex-1 select-none relative group">
                    <span class="absolute -top-2 bg-slate-700/90 text-[10px] px-1.5 py-0.5 rounded-full font-mono border border-slate-500/40">Space</span>
                    <span id="lid-icon" class="text-2xl transition-transform group-hover:scale-110">🚽</span>
                    <span id="lid-text" class="text-xs text-center tracking-wide leading-tight">Крышка: Откр</span>
                </button>

            </div>
        </div>
    </div>

    <script>
        const BOWL_CENTER_Z = -0.25;
        const RIM_HEIGHT = 0.78;
        
        function getWaterSurfaceY() {
            return Math.min(RIM_HEIGHT + 0.012, state.waterLevel) + 0.01;
        }

        const state = {
            coverMode: 0, // 0: Both Open, 1: Seat Down / Lid Open, 2: Both Closed
            targetSeatAngle: -1.85,
            targetLidAngle: -1.85,
            currentSeatAngle: -1.85,
            currentLidAngle: -1.85,
            isPeeing: false,
            waterLevel: 0.48, 
            baseWaterLevel: 0.48,
            overflowWaterLevel: RIM_HEIGHT,
            maxWaterLevel: 1.15,
            
            // Fluid composition
            waterVol: 1.0,
            peeVol: 0.0,
            poopVol: 0.0,
            
            floorPuddleVol: 0.0,
            
            poopObjects: [],
            peeParticles: [],
            splatters: [],
            floorSplatters: [],
            spillCascades: [],
            
            isFlushing: false,
            flushPhase: 0,
            flushTimer: 0,
            soundEnabled: true,
            lastSpawnType: 'Тип 4 (Норма)'
        };

        const ripples = [];
        const splashParticles = [];

        // DOM Element References
        const container = document.getElementById('canvas-container');
        const btnPee = document.getElementById('btn-pee');
        const btnPoop = document.getElementById('btn-poop');
        const btnFlush = document.getElementById('btn-flush');
        const btnLid = document.getElementById('btn-lid');
        const btnSound = document.getElementById('btn-sound');
        const soundIcon = document.getElementById('sound-icon');
        const soundLabel = document.getElementById('sound-label');

        const barWater = document.getElementById('bar-water-level');
        const statWater = document.getElementById('stat-water-level');
        const statMix = document.getElementById('stat-mix-status');
        const statOverflow = document.getElementById('stat-overflow-status');
        const statBristol = document.getElementById('stat-bristol-type');

        // Three.js Core Variables
        let scene, camera, renderer, controls;
        let toiletGroup, lidGroup, seatGroup, waterMesh, floorPuddleMesh, floorSplatGroup;
        let waterMaterial, floorPuddleMaterial, stoolMaterial;
        let proceduralTextures = {};

        function generateProceduralTextures() {
            // 1. Stool Surface Bump & Roughness Texture (Organic cracks, grain, wet shine)
            const stoolCanvas = document.createElement('canvas');
            stoolCanvas.width = 512;
            stoolCanvas.height = 512;
            const sCtx = stoolCanvas.getContext('2d');
            sCtx.fillStyle = '#808080';
            sCtx.fillRect(0, 0, 512, 512);

            // Add multi-scale noise for stool organic texture
            for (let i = 0; i < 25000; i++) {
                const x = Math.random() * 512;
                const y = Math.random() * 512;
                const r = Math.random() * 2.5 + 0.5;
                const val = Math.floor(Math.random() * 110 + 70);
                sCtx.fillStyle = `rgb(${val},${val},${val})`;
                sCtx.beginPath();
                sCtx.arc(x, y, r, 0, Math.PI * 2);
                sCtx.fill();
            }

            // Draw micro-cracks and wrinkles
            sCtx.strokeStyle = '#303030';
            sCtx.lineWidth = 1.2;
            for (let i = 0; i < 40; i++) {
                sCtx.beginPath();
                let cx = Math.random() * 512;
                let cy = Math.random() * 512;
                sCtx.moveTo(cx, cy);
                for (let j = 0; j < 6; j++) {
                    cx += (Math.random() - 0.5) * 40;
                    cy += (Math.random() - 0.5) * 40;
                    sCtx.lineTo(cx, cy);
                }
                sCtx.stroke();
            }

            const stoolBumpTex = new THREE.CanvasTexture(stoolCanvas);
            stoolBumpTex.wrapS = THREE.RepeatWrapping;
            stoolBumpTex.wrapT = THREE.RepeatWrapping;
            stoolBumpTex.repeat.set(2, 2);

            // 2. High Quality Bathroom Floor Tile Texture
            const floorCanvas = document.createElement('canvas');
            floorCanvas.width = 1024;
            floorCanvas.height = 1024;
            const fCtx = floorCanvas.getContext('2d');
            
            // Slate marble tiles
            fCtx.fillStyle = '#1e293b';
            fCtx.fillRect(0, 0, 1024, 1024);

            const tileSize = 256;
            for (let x = 0; x < 1024; x += tileSize) {
                for (let y = 0; y < 1024; y += tileSize) {
                    // Tile base with subtle gradient
                    const grad = fCtx.createLinearGradient(x, y, x + tileSize, y + tileSize);
                    grad.addColorStop(0, '#1e293b');
                    grad.addColorStop(0.5, '#243044');
                    grad.addColorStop(1, '#182232');
                    fCtx.fillStyle = grad;
                    fCtx.fillRect(x + 2, y + 2, tileSize - 4, tileSize - 4);

                    // Subtle stone grain
                    fCtx.fillStyle = 'rgba(255,255,255,0.02)';
                    for (let n = 0; n < 300; n++) {
                        fCtx.fillRect(x + Math.random() * tileSize, y + Math.random() * tileSize, 2, 2);
                    }

                    // Grout Lines
                    fCtx.strokeStyle = '#0f172a';
                    fCtx.lineWidth = 4;
                    fCtx.strokeRect(x, y, tileSize, tileSize);
                }
            }

            const floorTex = new THREE.CanvasTexture(floorCanvas);
            floorTex.wrapS = THREE.RepeatWrapping;
            floorTex.wrapT = THREE.RepeatWrapping;
            floorTex.repeat.set(4, 4);

            // Floor Bump Map
            const floorBumpCanvas = document.createElement('canvas');
            floorBumpCanvas.width = 512;
            floorBumpCanvas.height = 512;
            const fbCtx = floorBumpCanvas.getContext('2d');
            fbCtx.fillStyle = '#808080';
            fbCtx.fillRect(0, 0, 512, 512);
            fbCtx.strokeStyle = '#000000';
            fbCtx.lineWidth = 8;
            const bTileSize = 128;
            for (let x = 0; x < 512; x += bTileSize) {
                for (let y = 0; y < 512; y += bTileSize) {
                    fbCtx.strokeRect(x, y, bTileSize, bTileSize);
                }
            }
            const floorBumpTex = new THREE.CanvasTexture(floorBumpCanvas);
            floorBumpTex.wrapS = THREE.RepeatWrapping;
            floorBumpTex.wrapT = THREE.RepeatWrapping;
            floorBumpTex.repeat.set(4, 4);

            // 3. Wall Subway Tile Texture
            const wallCanvas = document.createElement('canvas');
            wallCanvas.width = 1024;
            wallCanvas.height = 1024;
            const wCtx = wallCanvas.getContext('2d');
            wCtx.fillStyle = '#334155';
            wCtx.fillRect(0, 0, 1024, 1024);

            const wW = 256;
            const wH = 128;
            let row = 0;
            for (let y = 0; y < 1024; y += wH) {
                const offsetX = (row % 2 === 0) ? 0 : wW / 2;
                for (let x = -wW; x < 1024 + wW; x += wW) {
                    const gx = x + offsetX;
                    wCtx.fillStyle = '#3a4a5e';
                    wCtx.fillRect(gx + 2, y + 2, wW - 4, wH - 4);
                    wCtx.strokeStyle = '#1e293b';
                    wCtx.lineWidth = 4;
                    wCtx.strokeRect(gx, y, wW, wH);
                }
                row++;
            }

            const wallTex = new THREE.CanvasTexture(wallCanvas);
            wallTex.wrapS = THREE.RepeatWrapping;
            wallTex.wrapT = THREE.RepeatWrapping;
            wallTex.repeat.set(3, 3);

            proceduralTextures = {
                stoolBump: stoolBumpTex,
                floor: floorTex,
                floorBump: floorBumpTex,
                wall: wallTex
            };
        }

        function getRenderPixelRatio() {
            // Supersampling on ordinary displays, capped by pixel and GPU budgets.
            const w = Math.max(1, window.innerWidth), h = Math.max(1, window.innerHeight);
            const limit = renderer ? renderer.capabilities.maxTextureSize : 4096;
            return Math.min(Math.max(1.5, window.devicePixelRatio || 1), 2.5,
                Math.sqrt(10000000 / (w * h)), limit / w, limit / h);
        }

        function initScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x090d16);
            scene.fog = new THREE.FogExp2(0x090d16, 0.07);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 50);
            camera.position.set(0, 2.3, 2.9);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(getRenderPixelRatio());
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.15;
            renderer.outputEncoding = THREE.sRGBEncoding;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.target.set(0, 0.7, BOWL_CENTER_Z);
            controls.maxPolarAngle = Math.PI / 2 + 0.08; 
            controls.minDistance = 0.9;
            controls.maxDistance = 6.0;

            window.addEventListener('resize', onWindowResize);
        }

        function initEnvironment() {
            generateProceduralTextures();
            Object.values(proceduralTextures).forEach(texture => {
                texture.anisotropy = Math.min(16, renderer.capabilities.getMaxAnisotropy());
                texture.minFilter = THREE.LinearMipmapLinearFilter;
            });
            proceduralTextures.floor.encoding = THREE.sRGBEncoding;
            proceduralTextures.wall.encoding = THREE.sRGBEncoding;

            const ambient = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambient);

            // Key Ceiling Spotlight with soft realistic shadow
            const spotLight = new THREE.SpotLight(0xfff7ed, 3.8);
            spotLight.position.set(1.6, 5.0, 2.2);
            spotLight.angle = Math.PI / 3.2;
            spotLight.penumbra = 0.45;
            spotLight.castShadow = true;
            const shadowSize = Math.min(4096, renderer.capabilities.maxTextureSize);
            spotLight.shadow.mapSize.set(shadowSize, shadowSize);
            spotLight.shadow.camera.near = 0.5;
            spotLight.shadow.camera.far = 10;
            spotLight.shadow.bias = -0.00008;
            spotLight.shadow.normalBias = 0.02;
            scene.add(spotLight);

            // Soft Fill Light from left
            const fillLight = new THREE.DirectionalLight(0xe0f2fe, 1.1);
            fillLight.position.set(-2.2, 3.5, 1.8);
            scene.add(fillLight);

            // Blue Rim Backlight for specular rim reflections
            const rimLight = new THREE.DirectionalLight(0x38bdf8, 1.2);
            rimLight.position.set(-1.8, 2.8, -3.2);
            scene.add(rimLight);

            // Warm subtle bounce light from floor
            const bounceLight = new THREE.PointLight(0xfed7aa, 0.6, 4);
            bounceLight.position.set(0, 0.2, 0.5);
            scene.add(bounceLight);

            // Tiled Floor with Bump Map & Roughness
            const floorMat = new THREE.MeshStandardMaterial({
                map: proceduralTextures.floor,
                bumpMap: proceduralTextures.floorBump,
                bumpScale: 0.012,
                roughness: 0.25,
                metalness: 0.08
            });
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(12, 12), floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Container for Splatters on Floor
            floorSplatGroup = new THREE.Group();
            scene.add(floorSplatGroup);

            // Floor Overflow Main Puddle Mesh
            const puddleGeo = new THREE.CircleGeometry(1.0, 64);
            floorPuddleMaterial = new THREE.MeshPhysicalMaterial({
                color: 0x38bdf8,
                transparent: true,
                opacity: 0.0,
                roughness: 0.01,
                metalness: 0.02,
                clearcoat: 1.0,
                clearcoatRoughness: 0.01,
                transmission: 0.6,
                reflectivity: 0.95
            });
            floorPuddleMesh = new THREE.Mesh(puddleGeo, floorPuddleMaterial);
            floorPuddleMesh.rotation.x = -Math.PI / 2;
            floorPuddleMesh.position.set(0, 0.005, BOWL_CENTER_Z);
            scene.add(floorPuddleMesh);

            // Back Subway Tiled Wall
            const wallMat = new THREE.MeshStandardMaterial({
                map: proceduralTextures.wall,
                roughness: 0.35,
                metalness: 0.05
            });
            const backWall = new THREE.Mesh(new THREE.PlaneGeometry(12, 8), wallMat);
            backWall.position.set(0, 4, -3);
            backWall.receiveShadow = true;
            scene.add(backWall);
        }

        function createToiletGeometry() {
            toiletGroup = new THREE.Group();
            scene.add(toiletGroup);

            // Ultra realistic gloss porcelain material
            const porcelainMat = new THREE.MeshPhysicalMaterial({
                color: 0xf8fafc,
                roughness: 0.06,
                metalness: 0.02,
                clearcoat: 1.0,
                clearcoatRoughness: 0.03,
                reflectivity: 0.95
            });

            // Porcelain Bowl Lathe Geometry
            const points = [];
            points.push(new THREE.Vector2(0.22, 0.0));  
            points.push(new THREE.Vector2(0.34, 0.0));  
            points.push(new THREE.Vector2(0.28, 0.35)); 
            points.push(new THREE.Vector2(0.42, 0.75)); 
            points.push(new THREE.Vector2(0.42, RIM_HEIGHT)); 
            points.push(new THREE.Vector2(0.34, RIM_HEIGHT)); 
            points.push(new THREE.Vector2(0.32, 0.70)); 
            points.push(new THREE.Vector2(0.22, 0.42)); 
            points.push(new THREE.Vector2(0.12, 0.30)); 
            points.push(new THREE.Vector2(0.00, 0.28)); 

            const latheGeo = new THREE.LatheGeometry(points, 128);
            const bowlMesh = new THREE.Mesh(latheGeo, porcelainMat);
            bowlMesh.scale.set(1.0, 1.0, 1.18);
            bowlMesh.position.set(0, 0, BOWL_CENTER_Z);
            bowlMesh.castShadow = true;
            bowlMesh.receiveShadow = true;
            toiletGroup.add(bowlMesh);

            // Water Surface Mesh inside bowl with radial & height segments for wave simulation
            // Radial surface tessellation: the old cylinder had only a triangle fan on top.
            const waterGeo = new THREE.RingGeometry(0.0001, 0.33, 96, 20);
            waterGeo.rotateX(-Math.PI / 2);
            waterGeo.translate(0, 0.01, 0);
            waterGeo.attributes.position.setUsage(THREE.DynamicDrawUsage);
            
            const posAttr = waterGeo.attributes.position;
            waterGeo.userData = {
                origY: new Float32Array(posAttr.count),
                waveVel: new Float32Array(posAttr.count),
                waveDisp: new Float32Array(posAttr.count)
            };
            for (let i = 0; i < posAttr.count; i++) {
                waterGeo.userData.origY[i] = posAttr.getY(i);
                waterGeo.userData.waveVel[i] = 0;
                waterGeo.userData.waveDisp[i] = 0;
            }

            waterMaterial = new THREE.MeshPhysicalMaterial({
                color: 0x38bdf8,
                transparent: true,
                opacity: 0.85,
                roughness: 0.015,
                metalness: 0.02,
                clearcoat: 1.0,
                clearcoatRoughness: 0.01,
                transmission: 0.7,
                ior: 1.333,
                reflectivity: 0.95
            });
            waterMesh = new THREE.Mesh(waterGeo, waterMaterial);
            waterMesh.position.set(0, state.waterLevel, BOWL_CENTER_Z);
            waterMesh.scale.set(1.0, 1.0, 1.15);
            toiletGroup.add(waterMesh);

            // Toilet Tank
            const tankGroup = new THREE.Group();

        let audioCtx = null;
        let peeGainNode = null;
        let peeNoiseNode = null;

        function initAudio() {
            try {
                if (!audioCtx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) audioCtx = new AudioContext();
                }
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            } catch (e) {
                console.warn('AudioContext initialization prevented:', e);
            }
        }

        function startPeeSound() {
            if (!state.soundEnabled) return;
            initAudio();
            if (!audioCtx || peeNoiseNode) return;

            try {
                const bufferSize = audioCtx.sampleRate * 2;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const output = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;

                const noiseNode = audioCtx.createBufferSource();
                noiseNode.buffer = buffer;
                noiseNode.loop = true;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(1400, audioCtx.currentTime);
                filter.Q.setValueAtTime(3.0, audioCtx.currentTime);

                const gainNode = audioCtx.createGain();
                gainNode.gain.setValueAtTime(0.01, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.22, audioCtx.currentTime + 0.2);

                noiseNode.connect(filter);
                filter.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                noiseNode.start();

                peeNoiseNode = noiseNode;
                peeGainNode = gainNode;
            } catch (e) {
                peeNoiseNode = null;
                peeGainNode = null;
            }
        }

        function stopPeeSound() {
            if (!peeGainNode || !audioCtx) {
                peeNoiseNode = null;
                peeGainNode = null;
                return;
            }

            try {
                const nodeToStop = peeNoiseNode;
                const gainToRamp = peeGainNode;
                peeNoiseNode = null;
                peeGainNode = null;

                if (gainToRamp && gainToRamp.gain && typeof gainToRamp.gain.setValueAtTime === 'function') {
                    const now = audioCtx.currentTime;
                    gainToRamp.gain.setValueAtTime(gainToRamp.gain.value, now);
                    gainToRamp.gain.linearRampToValueAtTime(0.001, now + 0.15);
                }

                setTimeout(() => {
                    try {
                        if (nodeToStop) {
                            nodeToStop.stop();
                            nodeToStop.disconnect();
                        }
                        if (gainToRamp) {
                            gainToRamp.disconnect();
                        }
                    } catch (e) {}
                }, 160);
            } catch (e) {
                peeNoiseNode = null;
                peeGainNode = null;
            }
        }

        function playPlopSound() {
            if (!state.soundEnabled) return;
            initAudio();
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(260, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.12);
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.14);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } catch (e) {}
        }

        function playSplatSound() {
            if (!state.soundEnabled) return;
            initAudio();
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();

                osc.type = 'square';
                osc.frequency.setValueAtTime(140, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.09);
                gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.11);

                gain.connect(audioCtx.destination);
                osc.start();

        function playFlushSound() {
            if (!state.soundEnabled) return;
            initAudio();
            if (!audioCtx) return;
            try {
                const bufferSize = audioCtx.sampleRate * 3;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(300, audioCtx.currentTime);
                filter.frequency.linearRampToValueAtTime(1600, audioCtx.currentTime + 1.2);
                filter.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 3.2);

                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.4, audioCtx.currentTime + 0.5);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 3.2);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);
                noise.start();
                noise.stop(audioCtx.currentTime + 3.2);
            } catch (e) {}
        }

        function triggerWaterWave(impactX, impactZ, strength = 0.04) {
            if (!waterMesh || !waterMesh.geometry) return;
            const geo = waterMesh.geometry;
            const pos = geo.attributes.position;
            const userData = geo.userData;
            if (!userData || !userData.waveDisp) return;

            waterMesh.updateWorldMatrix(true, false);
            const localImpact = waterMesh.worldToLocal(new THREE.Vector3(impactX, getWaterSurfaceY(), impactZ));
            const localImpactX = localImpact.x;
            const localImpactZ = localImpact.z;

            for (let i = 0; i < pos.count; i++) {
                if (userData.origY[i] > 0.005) {
                    const vx = pos.getX(i);
                    const vz = pos.getZ(i);
                    const dist = Math.sqrt((vx - localImpactX) ** 2 + (vz - localImpactZ) ** 2);
                    
                    if (dist < 0.35) {
                        const impulse = Math.cos((dist / 0.35) * Math.PI * 0.5) * strength;
                        userData.waveVel[i] -= impulse;
                    }
                }
            }
        }

        function createHealthyStoolGeometry(formType) {
            if (formType === 0) {
                // BRISTOL SCALE TYPE 4: Smooth, soft, sausage-like, tapered ends (Healthy human stool)
                const points = [];
                const segments = 28;
                const length = 0.28 + Math.random() * 0.08;
                const bendX = (Math.random() - 0.5) * 0.12;
                const bendZ = (Math.random() - 0.5) * 0.10;
                const sCurve = (Math.random() - 0.5) * 0.06;

                for (let i = 0; i <= segments; i++) {
                    const t = i / segments;
                    // Natural organic double curve
                    const x = Math.sin(t * Math.PI) * bendX + Math.sin(t * Math.PI * 2) * sCurve;
                    const y = (t - 0.5) * length;
                    const z = (1 - Math.cos(t * Math.PI)) * bendZ * 0.5;
                    points.push(new THREE.Vector3(x, y, z));
                }

                const curve = new THREE.CatmullRomCurve3(points);
                const tubeGeo = new THREE.TubeGeometry(curve, 32, 0.038, 16, false);
                
                // Vertex displacement for tapered ends and organic surface contour
                const pos = tubeGeo.attributes.position;
                const vertex = new THREE.Vector3();

                for (let i = 0; i < pos.count; i++) {
                    vertex.fromBufferAttribute(pos, i);
                    const t = (vertex.y + length * 0.5) / length;

                    // Taper at ends (0 at tips, 1 in center)
                    let taper = Math.sin(Math.max(0, Math.min(1, t)) * Math.PI);
                    taper = Math.pow(taper, 0.45);

                    const angle = Math.atan2(vertex.z, vertex.x);
                    // Organic segmenting & subtle surface bumps
                    const subtleSegments = Math.sin(t * Math.PI * 10) * 0.0025 * taper;
                    const radialNoise = (Math.sin(angle * 4 + t * 12) * Math.cos(angle * 3 - t * 8)) * 0.003 * taper;
                    const netDisplacement = subtleSegments + radialNoise;

                    const radialDir = new THREE.Vector3(vertex.x, 0, vertex.z).normalize();
                    if (radialDir.lengthSq() > 0) {
                        vertex.x = radialDir.x * (0.038 * taper + netDisplacement);
                        vertex.z = radialDir.z * (0.038 * taper + netDisplacement);
                    }

                    pos.setXYZ(i, vertex.x, vertex.y, vertex.z);
                }

                tubeGeo.computeVertexNormals();
                return tubeGeo;

            } else if (formType === 1) {
                // BRISTOL SCALE TYPE 3: Sausage-like with cracks on surface
                const points = [];
                const segments = 24;
                const length = 0.26 + Math.random() * 0.06;
                const bendX = (Math.random() - 0.5) * 0.08;

                for (let i = 0; i <= segments; i++) {
                    const t = i / segments;
                    const x = Math.sin(t * Math.PI) * bendX;
                    const y = (t - 0.5) * length;
                    const z = (Math.random() - 0.5) * 0.01;
                    points.push(new THREE.Vector3(x, y, z));
                }

                const curve = new THREE.CatmullRomCurve3(points);
                const tubeGeo = new THREE.TubeGeometry(curve, 30, 0.04, 16, false);
                
                const pos = tubeGeo.attributes.position;
                const vertex = new THREE.Vector3();

                for (let i = 0; i < pos.count; i++) {
                    vertex.fromBufferAttribute(pos, i);
                    const t = (vertex.y + length * 0.5) / length;

                    let taper = Math.sin(Math.max(0, Math.min(1, t)) * Math.PI);
                    taper = Math.pow(taper, 0.4);

                    const angle = Math.atan2(vertex.z, vertex.x);
                    // Deeper cracks and surface grooves
                    const cracks = Math.sign(Math.sin(angle * 6 + t * 16)) * 0.004 * taper;
                    const ribs = Math.sin(t * Math.PI * 14) * 0.004 * taper;

                    const radialDir = new THREE.Vector3(vertex.x, 0, vertex.z).normalize();
                    if (radialDir.lengthSq() > 0) {
                        vertex.x = radialDir.x * (0.04 * taper + cracks + ribs);
                        vertex.z = radialDir.z * (0.04 * taper + cracks + ribs);
                    }

                    pos.setXYZ(i, vertex.x, vertex.y, vertex.z);
                }

                tubeGeo.computeVertexNormals();
                return tubeGeo;

            } else {
                // BRISTOL SCALE TYPE 5/6: Soft lumps/mushy stool
                const groupGeo = new THREE.SphereGeometry(0.04, 16, 16);
                groupGeo.scale(1.4, 0.6, 1.2);
                return groupGeo;
            }
        }
